<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Step 1</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    padding: 50px;
  }
  .form-container {
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    width: 380px;
  }
  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #1e40af;
  }
  label {
    display: block;
    margin: 12px 0 5px;
    font-weight: 600;
    color: #334155;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    background-color: #2563eb;
    border: none;
    color: white;
    font-weight: 700;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #1e40af;
  }
  .hidden {
    display: none;
  }
  .result {
    background: #e0f2fe;
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
    color: #1e3a8a;
  }
</style>
</head>
<body>
  <div class="form-container">
  <!-- 第一步 -->
  <div id="step1">
    <h2>Step 1: 基本情報</h2>
    <form method="post">
       {% csrf_token %}
    <label for="nationality">国籍</label>
    <input type="text" id="nationality" required />
    <label for="language">言語</label>
    <input type="text" id="language" required />
    <button type="submit">送信</button>
     </form>
  </div>
 </div> 
</body>
</html>
