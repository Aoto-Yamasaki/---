<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>結果ページ</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; margin: 0; padding: 0; }
        .container {
            width: 100vw;
            min-height: 100vh;
            background: #fff;
            border-radius: 0;
            box-shadow: none;
            padding: 40px 0 40px 0;
        }
        .chart {
            width: 200px;
            height: 140px;
            margin: 0 auto 24px;
            background: #eef;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
        }
        .explanation {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        /* ====== タブ全体の外枠 ====== */
        .tab-menu-wrapper {
            max-width: 70%;
            margin: 0 auto 24px ;
            background: #f0f5ff;
            border-radius: 16px;
            border: 1px solid #bdd0ee;
            padding: 18px 10px;
            box-shadow: 0 1px 4px #dde7f3;
        }
        .tab-menu {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .tab-menu button {
            padding: 10px 5%;
            border-radius: 12px;
            border: 1px solid #bbb;
            background: #f4f4f4;
            cursor: pointer;
            font-size: clamp(12px,2.0vw,16px);
        }
        /* ====== 商品エリアの外枠 ====== */
        .products-wrapper {
            max-width: 90%;
            margin: 0 auto;
            background: #f8f6ff;
            border-radius: 18px;
            border: 1px solid #c5b3f7;
            padding: 28px 32px;      /* ←ここを広めにする */
            box-sizing: border-box; 
            box-shadow: 0 2px 10px #ece6fd;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .product {
            background: #fff;
            border-radius: 16px;
            text-align: center;
            margin: 0 10px;
            padding: 18px 10px;
            box-shadow: 0 1px 6px #eee;
        }
        .product img {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            background: #ddd;
            object-fit: cover;
        }
        .product-name {
            margin-top: 14px;
            font-size: 1em;
        }
        .product-name a {
            color: #36c;
            text-decoration: underline;
        }
        @media (max-width: 900px) {
            .products { grid-template-columns: repeat(2, 1fr); }
            .chart { width: 140px; height: 90px; }
            .products-wrapper { padding: 20px 2px; }
        }
        @media (max-width: 600px) {
            .products { grid-template-columns: 1fr; }
            .chart { width: 100px; height: 60px; }
            .products-wrapper { padding: 12px 1px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chart">結果<br>チャート</div>
        <div class="explanation">
            解説文:--------------------------------------
        </div>
        <!-- タブメニューの外側の枠 -->
        <div class="tab-menu-wrapper">
            <div class="tab-menu">
                <button>地震</button>
                <button>津波</button>
                <button>噴火</button>
                <button>備蓄品</button>
                <button>土砂災害</button>
            </div>
        </div>
        <!-- 商品エリアの外側の枠 -->
        <div class="products-wrapper">
            <div class="products">
                <div class="product">
                    <img src="商品画像URL1" alt="商品1">
                    <div class="product-name"><a href="#">商品名・商品リンク</a></div>
                </div>
                <div class="product">
                    <img src="商品画像URL2" alt="商品2">
                    <div class="product-name"><a href="#">商品名・商品リンク</a></div>
                </div>
                <div class="product">
                    <img src="商品画像URL3" alt="商品3">
                    <div class="product-name"><a href="#">商品名・商品リンク</a></div>
                </div>
                <div class="product">
                    <img src="商品画像URL4" alt="商品4">
                    <div class="product-name"><a href="#">商品名・商品リンク</a></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
